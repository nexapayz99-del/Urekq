services:
  telegram-account-manager:
    build: .
    container_name: telegram-account-manager
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-7860}:7860"
    volumes:
      - ./data:/app/data
    depends_on:
      mongo:
        condition: service_healthy
    stop_grace_period: 30s

  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-manager}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
